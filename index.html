<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #0f0f23;
            color: #0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        h1 {
            margin-bottom: 10px;
            text-align: center;
        }
        #game-container {
            background: #111;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            border: 3px solid #0f0;
        }
        canvas {
            background: #000;
            border: 4px solid #0f0;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
            max-width: 400px;
        }
        .score {
            font-size: 24px;
            margin-bottom: 10px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0c0;
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇 Snake Game</h1>
    <div id="game-container">
        <div class="score">分数: <span id="score">0</span></div>
        <canvas id="game" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <p>使用方向键 ↑ ↓ ← → 控制蛇移动</p>
        <p>或者使用 WASD</p>
        <button onclick="startGame()">开始游戏 / 重玩</button>
        <button onclick="pauseGame()">暂停 / 继续</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;
        let count = 0;
        let score = 0;
        let snake = [
            {x: 160, y: 160},
            {x: 140, y: 160},
            {x: 120, y: 160},
        ];
        let dx = grid;
        let dy = 0;
        let food = {x: 300, y: 300};
        let gameOverFlag = false;
        let paused = false;

        function randomFood() {
            food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
        }

        function draw() {
            // 背景
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 蛇
            ctx.fillStyle = '#0f0';
            snake.forEach((part, index) => {
                ctx.fillRect(part.x, part.y, grid-2, grid-2);
                if (index === 0) {
                    // 蛇头
                    ctx.fillStyle = '#0c0';
                    ctx.fillRect(part.x, part.y, grid-2, grid-2);
                    ctx.fillStyle = '#0f0';
                }
            });

            // 食物
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x, food.y, grid-2, grid-2);
        }

        function update() {
            if (gameOverFlag || paused) return;

            count++;
            if (count < 6) return; // 控制速度
            count = 0;

            // 移动
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // 撞自己
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                randomFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            gameOverFlag = true;
            ctx.fillStyle = 'rgba(255,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width/2, canvas.height/2 - 20);
            ctx.fillText('分数: ' + score, canvas.width/2, canvas.height/2 + 30);
        }

        function changeDirection(e) {
            if (gameOverFlag) return;

            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx !== grid) { dx = -grid; dy = 0; }
                    break;
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy !== grid) { dx = 0; dy = -grid; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx !== -grid) { dx = grid; dy = 0; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy !== -grid) { dx = 0; dy = grid; }
                    break;
            }
        }

        function startGame() {
            snake = [
                {x: 160, y: 160},
                {x: 140, y: 160},
                {x: 120, y: 160},
            ];
            dx = grid;
            dy = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            gameOverFlag = false;
            paused = false;
            randomFood();
            draw();
        }

        function pauseGame() {
            paused = !paused;
        }

        // 初始化
        function init() {
            randomFood();
            draw();

            document.addEventListener('keydown', changeDirection);
            setInterval(update, 1000/60); // 60fps loop
        }

        window.onload = init;
    </script>
</body>
</html>
